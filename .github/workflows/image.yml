name: image

# Builds the cost-report container image natively on x86-64 and ARM64
# runners (no QEMU, no cross-compiling; only these two architectures are
# supported).
#
# - pull_request (job "build"): build both architectures, load locally,
#   smoke-test. No push, no registry credentials.
# - tag v* / manual run:
#   push   push each architecture by digest to GitHub Container Registry
#          (ghcr.io/<owner>/cost-report) and smoke-test the pushed digest.
#   merge  merge both digests into one multi-arch manifest list in GHCR and,
#          only when vars.DOCKERHUB_NAMESPACE is set, copy it to Docker Hub.
#   sign   per registry: sign with cosign v2 keyless (GitHub OIDC), attach
#          an SPDX SBOM per architecture as a cosign attestation, verify.
#
# GHCR needs no configuration: the workflow's GITHUB_TOKEN pushes the image.
# A new GHCR package may start private; see build/README.md for making it
# public (or giving the cluster an imagePullSecret).
#
# Optional Docker Hub copy (Settings > Secrets and variables > Actions):
#   vars.DOCKERHUB_NAMESPACE   Docker Hub user or organization (unset = skip)
#   secrets.DOCKERHUB_USERNAME Docker Hub user for the access token
#   secrets.DOCKERHUB_TOKEN    Docker Hub access token (Read & Write)

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # cosign v2 only: NeuVector verifies cosign v2 signatures, not the v3
  # bundle format. Latest v2 release per `git ls-remote --tags
  # https://github.com/sigstore/cosign` at the time of writing.
  COSIGN_RELEASE: v2.6.5
  SYFT_VERSION: v1.54.1

jobs:
  # Pull requests: build and smoke-test only. Read-only token.
  build:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Version for image label
        id: ver
        run: echo "version=0.0.0-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.ver.outputs.version }}
          provenance: false
          sbom: false
          load: true
          push: false
          tags: cost-report:smoke

      - name: Smoke test (local image)
        run: build/smoke-test.sh cost-report:smoke "$GITHUB_SHA"

  # Release: push each architecture by digest to GHCR; tags are added in merge.
  push:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
          OWNER: ${{ github.repository_owner }}
        # GHCR repository names must be lowercase.
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${OWNER,,}/cost-report" >> "$GITHUB_ENV"

      - name: Check optional Docker Hub configuration
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          HAS_USER: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [ -z "$NAMESPACE" ]; then
            echo "vars.DOCKERHUB_NAMESPACE is not set: publishing to GHCR only."
            exit 0
          fi
          missing=""
          [ "$HAS_USER" = "true" ] || missing="$missing secrets.DOCKERHUB_USERNAME"
          [ "$HAS_TOKEN" = "true" ] || missing="$missing secrets.DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::vars.DOCKERHUB_NAMESPACE is set but these are missing:$missing (see build/README.md)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Version for image label
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            # The binary reports Cargo's version (cost-report --version, /version);
            # a release tag must match it.
            cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
            if [ "${REF_NAME#v}" != "$cargo_version" ]; then
              echo "::error::tag ${REF_NAME} does not match Cargo.toml workspace version ${cargo_version}"
              exit 1
            fi
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.ver.outputs.version }}
          # Keep each digest a plain image manifest; the SBOM is attached
          # with cosign in the sign job instead of as a BuildKit attestation.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Smoke test (pushed digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: build/smoke-test.sh "${IMAGE}@${DIGEST}" "$GITHUB_SHA"

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Manifest list in GHCR (and an optional copy in Docker Hub). No OIDC token:
  # artifacts from the same run download with the runtime token.
  merge:
    needs: push
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Image names
        env:
          OWNER: ${{ github.repository_owner }}
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          echo "IMAGE=ghcr.io/${OWNER,,}/cost-report" >> "$GITHUB_ENV"
          if [ -n "$NAMESPACE" ]; then
            echo "DOCKERHUB_IMAGE=docker.io/${NAMESPACE}/cost-report" >> "$GITHUB_ENV"
          fi

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_NAMESPACE != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Deploy by digest; tags are for humans. No floating "latest".
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Create manifest list (GHCR)
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          count="$(find . -maxdepth 1 -type f | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 platform digests, got $count"
            exit 1
          fi
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t sources < <(for d in *; do echo "${IMAGE}@sha256:${d}"; done)
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          first_tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          digest="$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in sha256:*) ;; *) echo "::error::no index digest"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}@${digest}"

      - name: Copy manifest list to Docker Hub
        id: dockerhub
        if: vars.DOCKERHUB_NAMESPACE != ''
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        # Same tags as in GHCR, with the Docker Hub repository in front.
        run: |
          mapfile -t tag_args < <(jq -r --arg from "${IMAGE}:" --arg to "${DOCKERHUB_IMAGE}:" \
            '.tags[] | "-t", ($to + ltrimstr($from))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tag_args[@]}" "${IMAGE}@${DIGEST}"
          digest="$(docker buildx imagetools inspect "${tag_args[1]}" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in sha256:*) ;; *) echo "::error::no index digest on Docker Hub"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}@${digest}"

      - name: Signing targets
        id: targets
        env:
          GHCR_DIGEST: ${{ steps.manifest.outputs.digest }}
          DOCKERHUB_DIGEST: ${{ steps.dockerhub.outputs.digest }}
        run: |
          targets="$(jq -cn --arg i "$IMAGE" --arg d "$GHCR_DIGEST" '[{registry: "ghcr", image: $i, digest: $d}]')"
          if [ -n "${DOCKERHUB_IMAGE:-}" ]; then
            targets="$(jq -c --arg i "$DOCKERHUB_IMAGE" --arg d "$DOCKERHUB_DIGEST" \
              '. + [{registry: "dockerhub", image: $i, digest: $d}]' <<< "$targets")"
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$targets"

  # Signing and SBOM attestations, once per registry. The only job with an
  # OIDC token: it is exchanged for a short-lived Fulcio certificate bound to
  # this workflow. packages: write lets cosign store signatures in GHCR.
  sign:
    needs: merge
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.merge.outputs.targets) }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      packages: write
    env:
      IMAGE: ${{ matrix.image }}
      DIGEST: ${{ matrix.digest }}
    steps:
      - name: Log in to GHCR
        if: matrix.registry == 'ghcr'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: matrix.registry == 'dockerhub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}

      - name: Check cosign major version
        run: |
          cosign version
          cosign version --json | jq -e '.gitVersion | startswith("v2.")' >/dev/null

      - name: Sign manifest list and platform manifests
        # --recursive also signs each platform manifest, so a verifier that
        # resolves the per-architecture digest finds a signature too.
        # --new-bundle-format=false is the v2 default; it is stated so that a
        # version bump cannot silently switch to the bundle format.
        run: cosign sign --yes --recursive --new-bundle-format=false "${IMAGE}@${DIGEST}"

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Generate SBOMs and attach as attestations
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          : > "$RUNNER_TEMP/platforms.txt"
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" \
            | jq -r '.manifests[] | "\(.platform.os)-\(.platform.architecture) \(.digest)"' \
            | while read -r plat pdigest; do
                out="$RUNNER_TEMP/sbom/cost-report-${plat}.spdx.json"
                "$SYFT" scan "registry:${IMAGE}@${pdigest}" -o "spdx-json=${out}"
                cosign attest --yes --new-bundle-format=false --type spdxjson --predicate "$out" "${IMAGE}@${pdigest}"
                echo "$plat $pdigest" >> "$RUNNER_TEMP/platforms.txt"
              done
          [ "$(wc -l < "$RUNNER_TEMP/platforms.txt")" -eq 2 ]

      - name: Verify signature and attestations
        env:
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          while read -r plat pdigest; do
            cosign verify "${IMAGE}@${pdigest}" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            cosign verify-attestation "${IMAGE}@${pdigest}" --type spdxjson \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            echo "verified $plat $pdigest"
          done < "$RUNNER_TEMP/platforms.txt"

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx-${{ matrix.registry }}
          path: ${{ runner.temp }}/sbom/*.spdx.json
          if-no-files-found: error

      - name: Job summary
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          {
            echo "## cost-report image (${IMAGE%%/*})"
            echo
            echo "Reference this in Helm values (by digest, not tag):"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "| Platform | Digest |"
            echo "|---|---|"
            while read -r plat pdigest; do echo "| ${plat} | \`${pdigest}\` |"; done < "$RUNNER_TEMP/platforms.txt"
            echo
            echo "Signed with cosign ${COSIGN_RELEASE} (keyless). Workflow identity: \`https://github.com/${WORKFLOW_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
