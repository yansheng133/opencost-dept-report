name: publish

# On a release tag (vX.Y.Z, the same tag that builds the image):
#
# 1. The UI extension and the backend Helm chart (cost-report) are added
#    to the gh-pages branch, a Helm repository:
#      https://yansheng133.github.io/opencost-dept-report   (GitHub Pages from gh-pages)
#      https://raw.githubusercontent.com/yansheng133/opencost-dept-report/gh-pages
#    In Rancher: Extensions -> Manage Repositories (or Apps -> Repositories)
#    -> add the URL; cost-report then shows on the Extensions page. The extension
#    is built and packaged by @rancher/shell's own publish script, as the
#    Rancher extension docs describe ("Publishing an Extension"), only from
#    extension/ instead of the repository root.
#    The cost-report chart is published with the image digest of this release
#    filled in (image.digest), so `helm install` needs no digest; the job
#    waits for the image workflow of the same tag to push it.
# 2. A GitHub release is created with the notes in docs/releases/<tag>.md.
#
# The versions must agree: the tag, Cargo.toml, the chart and the
# extension's package.json.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish again (for example v1.0.0)
        required: true

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    env:
      # Not TAG: @rancher/shell's chart patch script reads $TAG as the
      # extension version, and a leading "v" breaks loading the extension.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Versions agree
        id: ver
        run: |
          fail() { echo "::error::$1"; exit 1; }
          v="${RELEASE_TAG#v}"
          cargo="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          ext="$(jq -r .version extension/pkg/cost-report-ext/package.json)"
          for c in cost-report; do
            [ "$(sed -n 's/^version: //p' charts/$c/Chart.yaml)" = "$v" ] || fail "charts/$c version is not $v"
            [ "$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' charts/$c/Chart.yaml)" = "$v" ] || fail "charts/$c appVersion is not $v"
          done
          [ "$cargo" = "$v" ] || fail "Cargo.toml version $cargo is not $v"
          [ "$ext" = "$v" ] || fail "extension version $ext is not $v"
          # The card icon comes from this tag, so a later change on main does
          # not change older versions' cards.
          grep -q "\"icon\": \"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${RELEASE_TAG}/" extension/pkg/cost-report-ext/package.json \
            || fail "the extension icon URL must point at ${RELEASE_TAG}"
          [ -f "docs/releases/${RELEASE_TAG}.md" ] || fail "docs/releases/${RELEASE_TAG}.md (the release notes) is missing"
          git show-ref -q gh-pages || fail "the gh-pages branch must exist"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3

      - name: Build the extension and its chart
        working-directory: extension
        run: |
          npm install -g yarn@1.22.22
          yarn install --frozen-lockfile
          yarn test
          # Writes tmp/{assets,charts,extensions,index.yaml}; the index is
          # merged with the one already on gh-pages.
          env -u TAG yarn publish-pkgs -s "${GITHUB_REPOSITORY}" -b gh-pages -t "cost-report-ext-${{ steps.ver.outputs.version }}"
          test -f tmp/index.yaml

      - name: Image digest of this release
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/cost-report:${{ steps.ver.outputs.version }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin >/dev/null
          # The image workflow of this tag builds both architectures first.
          for _ in $(seq 1 90); do
            if digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest)" \
              && [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              echo "$IMAGE is $digest"
              docker logout ghcr.io >/dev/null
              # Readers pull without logging in: say so if they cannot.
              repo="${IMAGE#ghcr.io/}"; repo="${repo%:*}"
              tok="$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token || true)"
              code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${tok}" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://ghcr.io/v2/${repo}/manifests/${digest}")"
              [ "$code" = "200" ] || echo "::warning::the image cannot be pulled without logging in (HTTP $code); make the GHCR package public"
              exit 0
            fi
            sleep 30
          done
          echo "::error::$IMAGE did not appear within 45 minutes"
          exit 1

      # The branch as it is now: the index is merged with this copy, not the
      # one the publish script fetched through the (cached) raw URL.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages

      - name: Add the backend charts to the index
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          out=extension/tmp
          work="$(mktemp -d)"
          cp -R charts/cost-report "$work/"
          # The top-level image block only (two-space keys right under it).
          sed -i "/^image:/,/^[a-z]/{s|^  digest: \"\"|  digest: \"${DIGEST}\"|;s|^  tag: \"\"|  tag: \"${VERSION}\"|}" "$work/cost-report/values.yaml"
          [ "$(grep -c "^  digest: \"${DIGEST}\"$" "$work/cost-report/values.yaml")" = 1 ] || { echo "::error::digest not set in values.yaml"; exit 1; }
          for c in cost-report; do
            mkdir -p "$out/assets/$c"
            helm package "$work/$c" -d "$out/assets/$c"
          done
          if [ -f gh-pages/index.yaml ]; then merge=gh-pages/index.yaml; else merge="$out/index.yaml"; fi
          helm repo index "$out/assets" --url assets --merge "$merge"
          mv "$out/assets/index.yaml" "$out/index.yaml"
          # Each chart is in the index at this version, without a "v" (the
          # extension's files are named cost-report-ext-<version>).
          for c in cost-report cost-report-ext; do
            got="$(yq -r ".entries.\"$c\"[] | .version" "$out/index.yaml" 2>/dev/null || true)"
            grep -qx "${VERSION}" <<< "$got" || { echo "::error::$c ${VERSION} missing from index.yaml (found: $(echo $got))"; exit 1; }
          done
          app="$(yq -r '.entries."cost-report-ext"[] | select(.version == strenv(VERSION)) | .appVersion' "$out/index.yaml")"
          [ "$app" = "${VERSION}" ] || { echo "::error::cost-report-ext appVersion is $app, not ${VERSION}"; exit 1; }
          test -f "$out/extensions/cost-report-ext/${VERSION}/plugin/cost-report-ext-${VERSION}.umd.min.js" \
            || { echo "::error::extensions/cost-report-ext/${VERSION}/plugin/cost-report-ext-${VERSION}.umd.min.js missing"; exit 1; }

      - name: Commit to gh-pages
        run: |
          cp -R extension/tmp/assets extension/tmp/charts extension/tmp/extensions gh-pages/
          cp extension/tmp/index.yaml gh-pages/index.yaml
          touch gh-pages/.nojekyll
          cd gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to publish"
          else
            git commit -m "Publish ${RELEASE_TAG}"
            git push origin gh-pages
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "docs/releases/${RELEASE_TAG}.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "cost-report ${RELEASE_TAG}" --notes-file "docs/releases/${RELEASE_TAG}.md"
          fi
