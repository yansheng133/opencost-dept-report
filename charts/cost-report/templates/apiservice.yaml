{{- /*
The backend as a Kubernetes aggregated API.

The page calls /apis/api.costreport.yansheng133.github.io/v1alpha1/... through
Rancher's /k8s/clusters/<id> proxy. This cluster's API server authenticates the
Rancher user, checks RBAC on the resource (rbac-users.yaml), and forwards the
request to the backend over TLS with its proxy client certificate and the user
in X-Remote-User / X-Remote-Group / X-Remote-Extra-*.

Serving certificate: a CA and a certificate for <service>.<namespace>.svc,
generated by Helm on first install and kept on upgrades (lookup); the CA goes
into the APIService caBundle so the API server verifies the backend. Offline
rendering (helm template) cannot look up and always generates new ones.
*/ -}}
{{- $svc := include "cost-report.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $secretName := printf "%s-apiserver-tls" $svc }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $crt := "" }}
{{- $key := "" }}
{{- $ca := "" }}
{{- if and $existing $existing.data (index $existing.data "ca.crt") (index $existing.data "tls.crt") (index $existing.data "tls.key") }}
{{- $crt = index $existing.data "tls.crt" }}
{{- $key = index $existing.data "tls.key" }}
{{- $ca = index $existing.data "ca.crt" }}
{{- else }}
{{- $caObj := genCA "cost-report-apiserver-ca" 3650 }}
{{- $dns := list (printf "%s.%s.svc" $svc $ns) (printf "%s.%s.svc.cluster.local" $svc $ns) }}
{{- $cert := genSignedCert (printf "%s.%s.svc" $svc $ns) nil $dns 3650 $caObj }}
{{- $crt = $cert.Cert | b64enc }}
{{- $key = $cert.Key | b64enc }}
{{- $ca = $caObj.Cert | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "cost-report.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
  ca.crt: {{ $ca }}
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  # <version>.<group>; the group is fixed in the backend (identity::GROUP).
  name: v1alpha1.api.costreport.yansheng133.github.io
  labels:
    {{- include "cost-report.labels" . | nindent 4 }}
spec:
  group: api.costreport.yansheng133.github.io
  version: v1alpha1
  service:
    namespace: {{ $ns }}
    name: {{ $svc }}
    port: {{ .Values.aggregatedApi.port }}
  caBundle: {{ $ca }}
  groupPriorityMinimum: 1000
  versionPriority: 15
